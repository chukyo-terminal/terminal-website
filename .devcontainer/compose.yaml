volumes:
  postgres-data:
  389ds-data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Use proper Docker networking instead of network_mode: service:db
    # to ensure reliable DNS resolution in all environments
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      ldap:
        condition: service_started
    networks:
      - app-network

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  postgres:
    image: postgres:latest
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  # 一時的なデータ (お問い合わせフォームの入力用 URL など) を保存する Valkey。valkey:6379 (TLS・認証なし)。
  # 保存したデータはコンテナを作り直すと消える。中身は `valkey-cli -h valkey` で確認できる (別途インストールが必要)
  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # メールの開発用の SMTP サーバー (Mailpit)。届いたメールはすべて受け止めて外部には配送しない (コンテナを作り直すと消える)。
  # ただし、サイトのアドレス (contact@terminal-website.test) 宛てのメールは、受信用の IMAP サーバー (imap サービス) にも配送する。
  # SMTP は mail:1025 (TLS なし)、POP3 は mail:1110、Web UI は mail:8025 (devcontainer.json で転送)
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./mailpit-relay.yaml:/etc/mailpit/relay.yaml:ro
    environment:
      # POP3 で受信箱を読めるようにする (s-nail 用。ユーザー dev / パスワード dev)
      MP_POP3_AUTH: "dev:dev"
      # アプリを SMTP 認証ありの設定にしても送れるよう、どのユーザー名・パスワードも (認証なしも) 受け付ける
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # サイトのアドレス宛てのメール (問い合わせ者からの返信) を IMAP サーバーにも配送する (配送先は mailpit-relay.yaml)
      MP_SMTP_RELAY_CONFIG: /etc/mailpit/relay.yaml
      MP_SMTP_RELAY_MATCHING: '^contact@terminal-website\.test$'

  # 管理画面のログインに使う、開発用の LDAP (389ds)。会員・組織のデータは cluvela の res/ldifs を .devcontainer/setup-ldap.sh で投入する
  # (コンテナを作り直すと消える場合は setup-ldap.sh を再実行する)。LDAP は ldap:3389 (TLS なし)、Directory Manager は cn=Directory Manager / 389ds
  ldap:
    image: 389ds/dirsrv:latest
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - 389ds-data:/data
    environment:
      DS_DM_PASSWORD: 389ds
      DS_SUFFIX_NAME: dc=cut,dc=gr,dc=jp

  # 問い合わせ者からの返信を受信するための、開発用の IMAP サーバー (GreenMail)。Mailpit から配送されたメールを受け取る (コンテナを作り直すと消える)。
  # IMAP は imap:3143 (TLS なし)。ユーザー名はメールアドレス (contact@terminal-website.test) で、どのパスワードでもログインできる
  imap:
    image: greenmail/standalone:latest
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
